name: Kafka Producer Job

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes

jobs:
  run-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Kafka producer
        env:
          # 🔐 Confluent Cloud credentials
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.CONFLUENT_BOOTSTRAP_SERVERS }}
          KAFKA_API_KEY: ${{ secrets.CONFLUENT_API_KEY }}
          KAFKA_API_SECRET: ${{ secrets.CONFLUENT_API_SECRET }}

          # 🔐 Kafka security
          KAFKA_SECURITY_PROTOCOL: SASL_SSL
          KAFKA_SASL_MECHANISM: PLAIN

          # 📌 Topic names
          TOPIC_TRANSACTIONS: ${{ secrets.KAFKA_TOPIC_TRANSACTIONS }}
          TOPIC_ALERTS: ${{ secrets.KAFKA_TOPIC_ALERTS }}
          TOPIC_METRICS: ${{ secrets.KAFKA_TOPIC_METRICS }}

        run: |
          python src/producer.py
