name: Kafka Producer Job

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes

jobs:
  run-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CONFLUENT_BOOTSTRAP_SERVERS: ${{ secrets.CONFLUENT_BOOTSTRAP_SERVERS }}
      CONFLUENT_API_KEY: ${{ secrets.CONFLUENT_API_KEY }}
      CONFLUENT_API_SECRET: ${{ secrets.CONFLUENT_API_SECRET }}
      KAFKA_TOPIC_TRANSACTIONS: ${{ secrets.KAFKA_TOPIC_TRANSACTIONS }}
      KAFKA_TOPIC_ALERTS: ${{ secrets.KAFKA_TOPIC_ALERTS }}
      KAFKA_TOPIC_METRICS: ${{ secrets.KAFKA_TOPIC_METRICS }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Kafka producer
        run: python src/producer.py
