version: '3.8'

services:
  # Transaction Producer
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: fraud-detection-producer
    environment:
      - CONFLUENT_BOOTSTRAP_SERVERS=${CONFLUENT_BOOTSTRAP_SERVERS}
      - CONFLUENT_API_KEY=${CONFLUENT_API_KEY}
      - CONFLUENT_API_SECRET=${CONFLUENT_API_SECRET}
      - KAFKA_TOPIC_TRANSACTIONS=${KAFKA_TOPIC_TRANSACTIONS}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - fraud-detection-network

  # Fraud Detection Consumer
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: fraud-detection-consumer
    environment:
      - CONFLUENT_BOOTSTRAP_SERVERS=${CONFLUENT_BOOTSTRAP_SERVERS}
      - CONFLUENT_API_KEY=${CONFLUENT_API_KEY}
      - CONFLUENT_API_SECRET=${CONFLUENT_API_SECRET}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FRAUD_THRESHOLD=${FRAUD_THRESHOLD}
      - KAFKA_TOPIC_TRANSACTIONS=${KAFKA_TOPIC_TRANSACTIONS}
      - KAFKA_TOPIC_ALERTS=${KAFKA_TOPIC_ALERTS}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./models:/app/models
      - ./logs:/app/logs
      - ~/.config/gcloud:/root/.config/gcloud:ro  # GCP credentials
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - fraud-detection-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fraud-detection-backend
    environment:
      - CONFLUENT_BOOTSTRAP_SERVERS=${CONFLUENT_BOOTSTRAP_SERVERS}
      - CONFLUENT_API_KEY=${CONFLUENT_API_KEY}
      - CONFLUENT_API_SECRET=${CONFLUENT_API_SECRET}
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - KAFKA_TOPIC_TRANSACTIONS=${KAFKA_TOPIC_TRANSACTIONS}
      - KAFKA_TOPIC_ALERTS=${KAFKA_TOPIC_ALERTS}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - fraud-detection-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Nginx serving static files)
  frontend:
    image: nginx:alpine
    container_name: fraud-detection-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - fraud-detection-network

networks:
  fraud-detection-network:
    driver: bridge

volumes:
  redis-data:
    driver: local